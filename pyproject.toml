[project]
name = "sandbox"
version = "0.1.0"
description = "Provision isolated multi-repo environments (worktrees, services, agent container) for coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
sandbox = "sandbox.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "ANN", "S", "PTH", "TRY", "C4", "RET"]
ignore = [
    "S603",   # subprocess without shell=True is the intended pattern
    "S607",   # `git`/`docker` are resolved from PATH on purpose
    "TRY003", # descriptive error messages at the raise site are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "ANN001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "integration: exercises real external tools (git); Linux CI only",
]
